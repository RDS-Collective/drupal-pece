name: Security Update PR

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday at 8 AM UTC
  workflow_dispatch:

jobs:
  create-security-update-pr:
    name: Create Security Update PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

      - name: Check for security updates
        run: |
          composer audit --format=json > current-audit.json
          VULNERABILITIES=$(jq '.advisories | length' current-audit.json)
          echo "VULNERABILITIES=$VULNERABILITIES" >> $GITHUB_ENV
          
          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "Found $VULNERABILITIES vulnerabilities"
            echo "HAS_VULNERABILITIES=true" >> $GITHUB_ENV
          else
            echo "No vulnerabilities found"
            echo "HAS_VULNERABILITIES=false" >> $GITHUB_ENV
          fi

      - name: Update dependencies with security fixes
        if: env.HAS_VULNERABILITIES == 'true'
        run: |
          # Update only packages with security advisories
          composer update --with-dependencies --dry-run --format=json > update-preview.json
          composer update --with-dependencies --no-interaction
          composer audit --format=json > post-update-audit.json

      - name: Generate update summary
        if: env.HAS_VULNERABILITIES == 'true'
        run: |
          echo "## Security Update Summary" > update-summary.md
          echo "" >> update-summary.md
          echo "### Vulnerabilities Fixed:" >> update-summary.md
          jq -r '.advisories[] | "- **\(.packageName)** \(.title) (Severity: \(.severity))"' current-audit.json >> update-summary.md
          echo "" >> update-summary.md
          echo "### Packages Updated:" >> update-summary.md
          git diff --name-only composer.lock > /dev/null && echo "- composer.lock updated" >> update-summary.md || echo "- No package updates" >> update-summary.md

      - name: Create Pull Request
        if: env.HAS_VULNERABILITIES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'security: update dependencies with security fixes'
          title: '🔒 Security Update: Fix vulnerabilities in dependencies'
          body-path: update-summary.md
          branch: security-updates-${{ github.run_number }}
          delete-branch: true
          labels: |
            security
            dependencies
            high-priority
            automated
