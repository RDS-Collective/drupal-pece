name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  COMPOSER_MEMORY_LIMIT: -1

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build theme assets
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build assets
        run: |
          for theme_dir in web/themes/custom/*/; do
            if [ -f "$theme_dir/package.json" ]; then
              cd "$theme_dir"
              npm ci
              npm run build || npm run build-bulma || true
              cd - > /dev/null
            fi
          done

      - name: Create deployment artifact
        run: |
          tar -czf pece-staging-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.ddev' \
            --exclude='tests' \
            --exclude='features' \
            --exclude='*.md' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pece-staging-${{ github.sha }}
          path: pece-staging-${{ github.sha }}.tar.gz
          retention-days: 30

      # Add your deployment steps here
      # Example for SSH deployment:
      # - name: Deploy to staging server
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       cd /var/www/staging
      #       wget ${{ steps.upload.outputs.artifact-url }}
      #       tar -xzf pece-staging-${{ github.sha }}.tar.gz
      #       ./vendor/bin/drush deploy

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build theme assets
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build assets
        run: |
          for theme_dir in web/themes/custom/*/; do
            if [ -f "$theme_dir/package.json" ]; then
              cd "$theme_dir"
              npm ci
              npm run build || npm run build-bulma || true
              cd - > /dev/null
            fi
          done

      - name: Create deployment artifact
        run: |
          tar -czf pece-production-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.ddev' \
            --exclude='tests' \
            --exclude='features' \
            --exclude='*.md' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pece-production-${{ github.sha }}
          path: pece-production-${{ github.sha }}.tar.gz
          retention-days: 90

      # Add your production deployment steps here
      # - name: Deploy to production server
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.PRODUCTION_HOST }}
      #     username: ${{ secrets.PRODUCTION_USER }}
      #     key: ${{ secrets.PRODUCTION_SSH_KEY }}
      #     script: |
      #       cd /var/www/production
      #       # Add backup steps
      #       # Download and extract artifact
      #       # Run deployment commands
