name: Dependency Updates

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Update Composer dependencies
        run: |
          composer update --with-dependencies --no-interaction
          composer normalize

      - name: Check for security updates
        run: composer audit --format=json > security-audit.json || true

      - name: Update Node.js dependencies
        run: |
          for theme_dir in web/themes/custom/*/; do
            if [ -f "$theme_dir/package.json" ]; then
              echo "Updating dependencies for $(basename "$theme_dir")"
              cd "$theme_dir"
              npm update
              cd - > /dev/null
            fi
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'Automated dependency updates'
          body: |
            This PR contains automated dependency updates.
            
            ## Changes
            - Updated Composer dependencies
            - Updated Node.js dependencies
            - Normalized composer.json
            
            Please review the changes and test thoroughly before merging.
            
            Security audit results are available in the security-audit.json file.
          branch: automated-dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
